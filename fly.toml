# Replace <app-name> and <region> during `fly launch`.
app = "<app-name>"
primary_region = "<region>"

[build]

[env]
  PORT = "3000"
  NEXT_PORT = "8080"
  DRAFTS_DB_PATH = "/data/app.db"
  VECTOR_STORE = "memory"
  API_ORIGIN = "http://localhost:3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: run state lives in an in-memory Map and a run pauses mid-flight
  # waiting for human approval. A stopped machine loses in-flight runs, so
  # auto-stop must stay disabled — verify by observation, not by reading config.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "demo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
